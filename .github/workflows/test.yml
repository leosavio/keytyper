name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every CPython version still supported upstream on Linux; the newest on macOS and Windows.
        include:
          - { os: ubuntu-24.04, python-version: "3.11" }
          - { os: ubuntu-24.04, python-version: "3.12" }
          - { os: ubuntu-24.04, python-version: "3.13" }
          - { os: ubuntu-24.04, python-version: "3.14" }
          - { os: ubuntu-24.04, python-version: "3.15" }
          - { os: macos-15, python-version: "3.15" }
          - { os: windows-2025, python-version: "3.15" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov pytest-mock flake8 "black==26.10.1" mypy

      - name: flake8
        run: |
          # syntax errors and undefined names fail the build; the rest is reported only
          flake8 keytyper --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 keytyper --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: black
        run: black --check keytyper tests examples

      - name: mypy
        run: mypy keytyper

      - name: pytest
        run: pytest tests -v --cov=keytyper --cov-report=term

      - name: examples compile
        run: |
          python -m py_compile examples/basic_usage.py
          python -m py_compile examples/advanced_demo.py
