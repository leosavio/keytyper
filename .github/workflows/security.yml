name: security

# zizmor: security audit of the GitHub Actions workflows (permissions, triggers, injection,
# pinning). CodeQL, Dependabot and secret scanning run from the repository settings. keytyper
# has no runtime dependencies, so there is nothing for a dependency audit to check at install time.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pipx ships with the GitHub-hosted Ubuntu images.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.33.1 --format github .github/workflows
