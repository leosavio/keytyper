[tox]
envlist = py38,py39,py310,py311,py312,flake8,mypy,black
isolated_build = True

[testenv]
deps = 
    pytest>=6.0
    pytest-cov>=2.0
    pytest-mock>=3.0
commands = pytest tests/ -v --cov=keytyper

[testenv:flake8]
deps = flake8
commands = flake8 keytyper tests

[testenv:mypy]
deps = mypy
commands = mypy keytyper

[testenv:black]
deps = black
commands = black --check keytyper tests

[testenv:format]
deps = 
    black
    isort
commands = 
    black keytyper tests examples
    isort keytyper tests examples

[testenv:docs]
deps = 
    sphinx
    sphinx-rtd-theme
commands = sphinx-build -b html docs docs/_build

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .tox,
    .eggs,
    *.egg-info

[coverage:run]
source = keytyper
omit = */tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
